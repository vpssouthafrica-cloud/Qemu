name: apt-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe apt
        run: |
          echo "== mirror file:"; cat /etc/apt/apt-mirrors.txt 2>/dev/null || echo none
          echo "== sources:"; grep -rhE "^(URIs|deb )" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -8
          echo "== lock holders:"; ps aux | grep -E "apt|dpkg|unattended" | grep -v grep || echo none
          echo "== dns:"; getent ahostsv4 archive.ubuntu.com | head -2 || echo "dns fail"
          echo "== update:"; sudo timeout 120 apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15 update 2>&1 | tail -6
          echo "== install:"; sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=15 install -y qemu-utils 2>&1 | tail -6
          qemu-img --version | head -1
